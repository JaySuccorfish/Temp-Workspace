name: Build & Release Succorfish Debug Monitor (Windows Installable/Portable & macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows Installable Setup (.exe)
        shell: pwsh
        run: |
          cd "BLE & Serial Monitoring"
          .\build_exe.ps1 -Mode OneDir -Version 2.4.0 -NoSmokeTest -Installer
      - name: Build Windows Portable Single-File (.exe)
        shell: pwsh
        run: |
          cd "BLE & Serial Monitoring"
          .\build_exe.ps1 -Mode OneFile -Version 2.4.0 -NoSmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: SuccorfishDebugMonitor-Windows
          path: |
            BLE & Serial Monitoring/dist/SuccorfishDebugMonitor.exe
            BLE & Serial Monitoring/dist/SuccorfishDebugMonitor-Windows-Installable-v*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS .app bundle
        run: |
          cd "BLE & Serial Monitoring"
          chmod +x Start_Monitor_Mac.command build_mac.sh
          ./build_mac.sh --version 2.4.0
          cd dist
          zip -r SuccorfishDebugMonitor-macOS.app.zip SuccorfishDebugMonitor.app
      - uses: actions/upload-artifact@v4
        with:
          name: SuccorfishDebugMonitor-macOS
          path: "BLE & Serial Monitoring/dist/SuccorfishDebugMonitor-macOS.app.zip"

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Rename release assets with version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          mv release-assets/SuccorfishDebugMonitor.exe "release-assets/SuccorfishDebugMonitor-Windows-Portable-${TAG}.exe"
          mv release-assets/SuccorfishDebugMonitor-macOS.app.zip "release-assets/SuccorfishDebugMonitor-macOS-${TAG}.app.zip"
          ls -lh release-assets
      - name: Create / Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Delete old differently-named assets if any before uploading clean set
            for old in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$old" --yes || true
            done
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "Succorfish Debug Monitor ${TAG}" --notes-file "BLE & Serial Monitoring/RELEASE_NOTES.md"
          else
            gh release create "$TAG" release-assets/* \
              --title "Succorfish Debug Monitor ${TAG}" \
              --notes-file "BLE & Serial Monitoring/RELEASE_NOTES.md"
          fi
