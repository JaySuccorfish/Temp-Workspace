name: Build & Release Windows EXE and macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows EXE
        shell: pwsh
        run: |
          cd "BLE & Serial Monitoring"
          .\build_exe.ps1 -Version 2.4.0 -NoSmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: ValtrackDebugMonitor-Windows
          path: "BLE & Serial Monitoring/dist/ValtrackDebugMonitor.exe"

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS .app bundle
        run: |
          cd "BLE & Serial Monitoring"
          chmod +x Start_Monitor_Mac.command build_mac.sh
          ./build_mac.sh --version 2.4.0
          cd dist
          zip -r ValtrackDebugMonitor-macOS.app.zip ValtrackDebugMonitor.app
      - uses: actions/upload-artifact@v4
        with:
          name: ValtrackDebugMonitor-macOS
          path: "BLE & Serial Monitoring/dist/ValtrackDebugMonitor-macOS.app.zip"

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Rename release assets with version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          mv release-assets/ValtrackDebugMonitor.exe "release-assets/ValtrackDebugMonitor-Windows-${TAG}.exe"
          mv release-assets/ValtrackDebugMonitor-macOS.app.zip "release-assets/ValtrackDebugMonitor-macOS-${TAG}.app.zip"
          ls -lh release-assets
      - name: Create / Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file "BLE & Serial Monitoring/RELEASE_NOTES.md"
          else
            gh release create "$TAG" release-assets/* \
              --title "Succorfish BLE & Serial Monitor ${TAG}" \
              --notes-file "BLE & Serial Monitoring/RELEASE_NOTES.md"
          fi
